<!DOCTYPE html>
<html lang="id">
<head>
  <title>Penggunaan Tag Tabel</title>
</head>
<body>
    <h1>Cara Membuat Tabel di HTML (<code>table</code> tag)</h1>
    <p>
      Tag <code>&lt;table&gt;</code> digunakan untuk membuat tabel di HTML. Tabel terdiri dari baris <code>&lt;tr&gt;</code>, header kolom <code>&lt;th&gt;</code>, dan sel data <code>&lt;td&gt;</code>.
    </p>
    <table border=""1">
        <tr>
          <th>Nama</th>
          <th>Usia</th>
          <th>Kota</th>
        </tr>
        <tr>
          <td>Kuroo</td>
          <td>25</td>
          <td>Jakarta</td>
        </tr>
        <tr>
          <td>Oikawa</td>
          <td>25</td>
          <td>Bandung</td>
        </tr>
        <tr>
          <td>Bokuto</td>
          <td>25</td>
          <td>Surabaya</td>
        </tr>
    </table>
</body>
</html>
