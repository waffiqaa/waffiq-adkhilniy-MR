<!DOCTYPE html>
<html>
<head>
  <title>Penggunaan Tag Image</title>
</head>
<body>
    <h1>Cara Menambahkan Gambar di HTML (<code>img</code> tag)</h1>
    <p>
      Tag <code>&lt;img&gt;</code> digunakan untuk menambahkan gambar di halaman HTML. Atribut <code>src</code> menentukan alamat gambar, dan <code>alt</code> memberikan deskripsi alternatif jika gambar tidak dapat ditampilkan.
    </p>
    <img 
      src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/React-icon.svg/120px-React-icon.svg.png"
      alt="Icon React" 
      height=200"
      width="200"
      />
</body>
</html>
