<!DOCTYPE html>
<html>
<head>
  <title>Belajar Tag Komentar (comment)</title>
</head>
<body>
    <h1>Cara Membuat Komentar di HTML</h1>
   <!-- <p>Ini berada di dalam tag komentar, 
           dan tidak akan tampil di browser</p>
   <p>Ini juga tidak tampil di browser</p>
    -->
    <p>
      Komentar di HTML digunakan untuk menyisipkan catatan atau penjelasan dalam kode yang tidak akan ditampilkan di browser.<br>
      Komentar dapat membantu pengembang memahami kode dengan lebih baik.</br>
    </p>
    
    <!--<p>Ini juga tidak tampil di browser dan kalimat diatas bukan komentar tapi akan tampil di browser</p> -->
</body>
</html>
