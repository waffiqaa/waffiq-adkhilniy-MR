<!DOCTYPE html>
<html>
<head>
  <title>Penggunaan Tag Link</title>
</head>
<body>
    <h1>Cara Membuat Link di HTML(<code>a</code> tag)</h1>
    <p>
      Tag <code>&lt;a&gt;</code> digunakan untuk membuat tautan (link) di HTML. Atribut href menentukan alamat tujuan tautan tersebut. Klik tautan untuk membuka halaman atau sumber lain.
    </p>
    <p>
      Contoh link: 
      <a href="https://www.google.com" target="_blank" rel="noopener" class="example-link">
        Kunjungi Google
      </a>
    </p>
</body>
</html>
