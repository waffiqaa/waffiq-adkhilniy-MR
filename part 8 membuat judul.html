<!DOCTYPE html>
<html>
<head>
  <title>penggunaan tag heading</title>
</head>
<body>
    <h1>Cara Membuat Judul / Heading di HTML</h1>
    <p>
      Tag digunakan di HTML untuk membuat judul utama.
      Judul membantu memberikan struktur pada halaman dan menunjukkan informasi penting kepada pengguna.
    </p>
    <h1>Ini adalah Judul Utama</h1>
    <h2>Ini adalah Sub Judul</h2>
    <h3>Ini adalah Judul Tingkat Tiga</h3>
</body>
</html>
